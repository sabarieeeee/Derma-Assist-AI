[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# 1. Route /api requests to Netlify Functions silently
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 2. Ensure React SPA routing works properly on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200